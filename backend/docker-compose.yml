services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: job_dheko
      POSTGRES_USER: jobdheako
      POSTGRES_PASSWORD: jobdheako
    ports: ["5433:5432"]
    volumes: ["jobdheako_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  jobdheako_pg:
